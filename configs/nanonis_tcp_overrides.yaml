# Hand-corrected Nanonis command definitions (Track B).
#
# These override the auto-generated entries from nanonis_tcp_auto.json during
# `convert_json_to_yaml.py`. Use this file for commands the PDF parser got wrong
# (boundary "bleed", missing/extra send args, wrong types). Definitions here are
# ground-truthed against spaik's hardware-tested BlueNanonisTCP.py and/or the
# bundled TCPProtocol_SPM.pdf. A command listed here fully replaces its
# auto-generated send/recv.

# --- Wrong/missing send arguments -------------------------------------------

Current.GainSet:        # auto had only gain_index; firmware needs filter_index too
  send:
    - {name: gain_index, type: int32}
    - {name: filter_index, type: int32}
  recv: []

Motor.PosGet:           # auto had no send args + float32 recv; both wrong
  send:
    - {name: group, type: uint32}
    - {name: timeout_ms, type: uint32}
  recv:
    - {name: x_m, type: float64}
    - {name: y_m, type: float64}
    - {name: z_m, type: float64}

Motor.FreqAmpGet:       # auto had no send arg; needs axis selector
  send:
    - {name: axis, type: uint16}
  recv:
    - {name: frequency_hz, type: float32}
    - {name: amplitude_v, type: float32}

# --- Parser "bleed": definitions concatenated across command boundaries ------

Bias.Pulse:             # auto had 57 send + huge recv; real command is small
  send:
    - {name: wait_until_done, type: uint32}
    - {name: bias_pulse_width_s, type: float32}
    - {name: bias_value_v, type: float32}
    - {name: z_controller_on_hold, type: uint16}
    - {name: pulse_absolute_relative, type: uint16}
  recv: []

BiasSpectr.SafeCond2Get:
  send: []
  recv:
    - {name: condition, type: int32}
    - {name: threshold, type: float32}
    - {name: signal_index, type: int32}
    - {name: comparison, type: uint16}

BiasSpectr.ChsGet:        # auto omitted the recorded-channel-names string array
  send: []
  recv:
    - {name: num_channels, type: int32}
    - {name: channel_indexes, type: array_int32}
    - {name: channels_size, type: int32}
    - {name: num_channels_names, type: int32}
    - {name: channels, type: array_string}

TipShaper.PropsGet:
  send: []
  recv:
    - {name: switch_off_delay_s, type: float32}
    - {name: change_bias, type: uint32}
    - {name: bias_v, type: float32}
    - {name: tip_lift_m, type: float32}
    - {name: lift_time_1_s, type: float32}
    - {name: bias_lift_v, type: float32}
    - {name: bias_settling_time_s, type: float32}
    - {name: lift_height_m, type: float32}
    - {name: lift_time_2_s, type: float32}
    - {name: end_wait_time_s, type: float32}
    - {name: restore_feedback, type: uint32}

Util.UnLock:            # auto had RT-frequency fields from a different command
  send: []
  recv: []

# --- PDF-derived (not present in spaik) -------------------------------------
# Ground truth: TCPProtocol_SPM.pdf (April 2025). Scalar-string "* size" fields
# are dropped (our `string` self-prefixes); string-array byte-size + count
# fields are kept (both are real wire fields).

Scan.PropsSet:          # firmware (R5.x) added Modules-names array + Autopaste
  send:
    - {name: continuous_scan, type: uint32}
    - {name: bouncy_scan, type: uint32}
    - {name: autosave, type: uint32}
    - {name: series_name, type: string}
    - {name: comment, type: string}
    - {name: modules_names_size, type: int32}
    - {name: modules_names_number, type: int32}
    - {name: modules_names, type: array_string}
    - {name: autopaste, type: uint32}
  recv: []

File.datLoad:           # auto mis-typed the size/count fields as string
  send:
    - {name: file_path, type: string}
    - {name: read_only_header, type: uint32}
  recv:
    - {name: channels_names_size, type: int32}
    - {name: num_channels, type: int32}
    - {name: channels_names, type: array_string}
    - {name: data_rows, type: int32}
    - {name: data_columns, type: int32}
    - {name: data, type: matrix_float32}
    - {name: header_rows, type: int32}
    - {name: header_columns, type: int32}
    - {name: header, type: matrix_string}

TCPLog.StatusGet:
  send: []
  recv:
    - {name: status, type: int32}

Script.ChsGet:
  send:
    - {name: acquire_buffer, type: uint16}
  recv:
    - {name: num_channels, type: int32}
    - {name: channel_indexes, type: array_int32}

Script.LUTDeploy:
  send:
    - {name: lut_index, type: int32}
    - {name: wait_until_finished, type: uint32}
    - {name: timeout_ms, type: int32}
  recv: []
